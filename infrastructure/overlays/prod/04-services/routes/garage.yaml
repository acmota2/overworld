---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/main/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-http-route
  namespace: garage
spec:
  parentRefs:
    - name: internal-gateway
      namespace: networking
  hostnames:
    - s3.${INTERNAL_ADDRESS}
    - garage-admin.${INTERNAL_ADDRESS}
  rules:
    - matches:
        - headers:
            - name: Host
              value: s3.${INTERNAL_ADDRESS}
      backendRefs:
        - name: garage-garage
          port: 3900
    - matches:
        - headers:
            - name: Host
              value: garage-admin.${INTERNAL_ADDRESS}
      backendRefs:
        - name: garage-garage
          port: 3903
