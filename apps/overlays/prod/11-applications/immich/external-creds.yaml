---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name immich-db-creds
  namespace: immich
spec:
  refreshInterval: 1m0s
  secretStoreRef:
    name: infisical-secret-store
    kind: ClusterSecretStore
  target:
    name: *name
  data:
    - secretKey: password
      remoteRef:
        key: /databases/immich-db
