---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 5m0s
  values:
    env:
      DB_HOSTNAME: psql-cluster-rw.db.svc.cluster.local
      DB_PORT: "5432"
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: immich-db-creds
            key: password
      REDIS_HOSTNAME: dragonfly.db.svc.cluster.local
      REDIS_PORT: "6379"

    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: internal-gateway
            namespace: networking
        hostnames:
          - "immich.${INTERNAL_ADDRESS}"
        rules:
          - backendRefs:
              - identifier: main
                port: 2283

    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc
      configuration:
        trash:
          enabled: true
          days: 30

    machine-learning:
      persistence:
        cache:
          enabled: true
          size: 10Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          storageClass: longhorn
