---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    configMaps:
      config:
        data:
          runner.yaml: |
            log:
              level: info
            runner:
              capacity: 2
              timeout: 1h
              shutdown_timeout: 3m
              labels:
                - ubuntu-latest:k8s:///config/podspec-default.yaml
                - default:k8s:///config/podspec-default.yaml
            plugins:
              k8s:
                address: "localhost:9090"
                options:
                  namespace: forgejo-runner
                  poll_timeout: 10m
                  resources: |
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      memory: 1Gi
          podspec-default.yaml: |-
            enableServiceLinks: false
            containers:
              - name: main
                image: node:24-bookworm
                imagePullPolicy: IfNotPresent
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    memory: 2Gi
            restartPolicy: Never
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/runner.yaml
            subPath: runner.yaml
            readOnly: true
          - path: /config/podspec-default.yaml
            subPath: podspec-default.yaml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      runner-secret:
        type: secret
        name: forgejo-runner-secret
        advancedMounts:
          forgejo-runner:
            runner:
              - path: /etc/forgejo-runner-secret
                readOnly: true
    rbac:
      roles:
        forgejo-runner:
          type: Role
          rules:
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["create", "get", "list", "watch", "delete"]
            - apiGroups: [""]
              resources: ["pods", "pods/log"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["pods/exec"]
              verbs: ["create", "get"]
      bindings:
        forgejo-runner:
          type: RoleBinding
          roleRef:
            identifier: forgejo-runner
          subjects:
            - identifier: forgejo-runner
    serviceAccount:
      forgejo-runner: {}
