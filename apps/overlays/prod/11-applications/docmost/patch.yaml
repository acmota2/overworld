---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docmost
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: app-template
        namespace: flux-system
  values:
    controllers:
      docmost:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env:
              - name: TZ
                value: "${TIMEZONE:=Etc/UTC}"
              - name: APP_URL
                value: "https://notes.${INTERNAL_ADDRESS}"
              - name: PORT
                value: "3000"
              - name: REDIS_URL
                value: "redis://dragonfly.db.svc.cluster.local:6379/0"
              - name: APP_SECRET
                valueFrom:
                  secretKeyRef:
                    name: docmost-app-secret
                    key: APP_SECRET
              - name: DATABASE_URL
                valueFrom:
                  secretKeyRef:
                    name: docmost-db-url
                    key: url
            resources:
              requests:
                cpu: 25m
                memory: 105M
              limits:
                memory: 512M
    route:
      app:
        hostnames:
          - "notes.${INTERNAL_ADDRESS}"
        parentRefs:
          - name: internal-gateway
            namespace: networking
    persistence:
      data:
        existingClaim: docmost-pvc
        globalMounts:
          - path: /app/data/storage
