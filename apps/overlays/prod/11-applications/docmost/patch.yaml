---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docmost
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: app-template
        namespace: flux-system
  values:
    controllers:
      docmost:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mirror.gcr.io/docmost/docmost
              tag: 0.95.0
            env:
              TZ: "${TIMEZONE:=Etc/UTC}"
              APP_URL: "https://notes.${INTERNAL_DOMAIN}"
              PORT: "3000"
              REDIS_URL: "redis://dragonfly.db.svc.cluster.local:6379/0"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: docmost-db-url
                    key: url
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 105M
              limits:
                memory: 512M
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ipFamilyPolicy: SingleStack
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "notes.${INTERNAL_DOMAIN}"
        parentRefs:
          - name: internal-gateway
            namespace: network
    persistence:
      data:
        existingClaim: ${VOLSYNC_CLAIM}
        globalMounts:
          - path: /app/data/storage
